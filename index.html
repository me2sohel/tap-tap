
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10050c">
  <meta name="description" content="A little heartbeat, seven memories, and a love beyond the universe.">
  <title>Touch My Heart ♥</title>

  <style>
    :root {
      --pink: #ff356e;
      --rose: #ff9bb8;
      --background: #10050c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 45%,
          #421326 0%, #200b17 42%, #080509 100%);
      color: #ffe3ec;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient romantic lighting */

    .glow {
      position: absolute;
      width: 85vw;
      height: 85vw;
      max-width: 600px;
      max-height: 600px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        #ff286b25 0%,
        #ff286b0c 43%,
        transparent 72%
      );
      animation: ambientGlow 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      z-index: 1;
      bottom: -35px;
      color: #ff8aaa;
      opacity: 0;
      pointer-events: none;
      animation: floatUp 9s linear infinite;
    }

    .p1 { left: 12%; animation-delay: 0s; }
    .p2 { left: 78%; animation-delay: 3s; }
    .p3 { left: 53%; animation-delay: 6s; }

    /* Heart screen */

    .experience {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .heart-area {
      position: relative;
      width: min(68vw, 310px);
      aspect-ratio: 1.08;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      filter:
        drop-shadow(0 0 16px #ff174b60)
        drop-shadow(0 0 38px #ff174b35);
      transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.2,.8,.2,1),
        filter .8s ease;
    }

    .heart-area.beating {
      animation: heartBeat 1.15s ease-in-out infinite;
    }

    .heart-area.leaving {
      opacity: 0;
      transform: scale(.52);
      filter: drop-shadow(0 0 0 transparent);
      pointer-events: none;
      animation: none;
    }

    .heart-area svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .heart-message {
      min-height: 44px;
      margin-top: 22px;
      color: #ffd6e2;
      font-size: clamp(21px, 5vw, 29px);
      letter-spacing: .4px;
      text-align: center;
      text-shadow: 0 0 18px #ff477e80;
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity .5s ease,
        transform .5s ease;
      pointer-events: none;
    }

    .heart-message span {
      color: #ff8eae;
      font-style: italic;
    }

    .heart-message.hidden {
      opacity: 0;
      transform: translateY(10px);
    }

    /* Cinematic photo scene */

    .photo-frame {
      position: absolute;
      z-index: 3;
      inset: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          ellipse at center,
          #351021 0%,
          #180811 58%,
          #080509 100%
        );
      opacity: 0;
      visibility: hidden;
      transform: scale(1.025);
      transition:
        opacity 1s ease,
        transform 1.2s cubic-bezier(.16,1,.3,1),
        visibility 1s;
      pointer-events: none;
    }

    .photo-frame.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .photo-frame img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(88vw, 480px);
      max-height: 76dvh;
      object-fit: contain;
      border-radius: 16px;
      opacity: 0;
      transform: scale(.78) translateY(12px);
      filter: brightness(.45) blur(9px);
      box-shadow:
        0 20px 80px #000c,
        0 0 30px #ff356e25,
        0 0 0 1px #ffc1d51c;
      transition:
        opacity 1.3s ease,
        transform 4s cubic-bezier(.16,1,.3,1),
        filter 1.4s ease,
        box-shadow 1.5s ease;
    }

    .photo-frame.visible img {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: brightness(1) blur(0);
      box-shadow:
        0 20px 80px #000c,
        0 0 35px #ff356e38,
        0 0 0 1px #ffc1d51c;
    }

    /* The final memory: a dramatic, slower reveal */

    .photo-frame.final-memory {
      background:
        radial-gradient(
          ellipse at center,
          #25113b 0%,
          #100817 55%,
          #030207 100%
        );
    }

    .photo-frame.final-memory img {
      max-width: 94vw;
      max-height: 84dvh;
      border-radius: 10px;
      box-shadow:
        0 0 35px #a66aff25,
        0 0 100px #7139b625,
        0 25px 90px #000d;
    }

    .photo-frame.final-memory.visible img {
      animation: universeReveal 6s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes universeReveal {
      0% {
        opacity: 0;
        transform: scale(.70);
        filter: brightness(.25) blur(12px);
      }
      28% {
        opacity: 1;
        filter: brightness(.75) blur(2px);
      }
      60% {
        filter: brightness(1.05) blur(0);
      }
      100% {
        opacity: 1;
        transform: scale(1.035);
        filter: brightness(1) blur(0);
      }
    }

    /* Small sparks on touch */

    .spark {
      position: absolute;
      z-index: 4;
      color: #ff8aaa;
      font-size: 20px;
      text-shadow: 0 0 14px #ff477e;
      pointer-events: none;
      animation: sparkUp 1.3s ease-out forwards;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.07); }
      23% { transform: scale(.99); }
      35% { transform: scale(1.13); }
      48% { transform: scale(1); }
    }

    @keyframes ambientGlow {
      from { transform: scale(.88); opacity: .6; }
      to { transform: scale(1.12); opacity: 1; }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(.6) rotate(0);
        opacity: 0;
      }
      15% { opacity: .55; }
      85% { opacity: .3; }
      100% {
        transform: translateY(-110vh) scale(1.3) rotate(35deg);
        opacity: 0;
      }
    }

    @keyframes sparkUp {
      from {
        opacity: 0;
        transform: translateY(0) scale(.6);
      }
      20% { opacity: 1; }
      to {
        opacity: 0;
        transform: translateY(-100px) scale(1.4) rotate(25deg);
      }
    }

    @media (max-width: 520px) {
      .heart-area {
        width: min(74vw, 285px);
      }

      .heart-message {
        margin-top: 18px;
      }

      .photo-frame {
        padding: 14px;
      }

      .photo-frame img {
        max-width: 92vw;
        max-height: 78dvh;
        border-radius: 12px;
      }

      .photo-frame.final-memory img {
        max-width: 96vw;
        max-height: 86dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow,
      .particle {
        animation-duration: 12s;
      }
    }
  </style>
</head>

<body>
  <main class="stage" id="stage">

    <div class="glow"></div>

    <span class="particle p1">♡</span>
    <span class="particle p2">♥</span>
    <span class="particle p3">✦</span>

    <section class="experience">

      <div
        class="heart-area beating"
        id="heartArea"
        role="button"
        tabindex="0"
        aria-label="Touch my heart"
      >
        <svg viewBox="0 0 240 220"
             xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true">
          <defs>
            <linearGradient id="heartGradient"
              x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff9aaf"/>
              <stop offset="22%" stop-color="#ff527d"/>
              <stop offset="53%" stop-color="#e90d48"/>
              <stop offset="78%" stop-color="#b80539"/>
              <stop offset="100%" stop-color="#65051f"/>
            </linearGradient>

            <linearGradient id="shadowGradient"
              x1="0" y1="0" x2=".8" y2="1">
              <stop offset="0%" stop-color="#ffb0c5"
                    stop-opacity=".05"/>
              <stop offset="55%" stop-color="#79001e"
                    stop-opacity=".12"/>
              <stop offset="100%" stop-color="#27000b"
                    stop-opacity=".75"/>
            </linearGradient>

            <linearGradient id="shineGradient"
              x1="0" y1="0" x2="1" y2=".8">
              <stop offset="0%" stop-color="#fff0f5"
                    stop-opacity=".85"/>
              <stop offset="30%" stop-color="#ffb6cb"
                    stop-opacity=".4"/>
              <stop offset="100%" stop-color="#ffb6cb"
                    stop-opacity="0"/>
            </linearGradient>

            <filter id="softGlow" x="-100%" y="-100%"
                    width="300%" height="300%">
              <feGaussianBlur stdDeviation="2"/>
            </filter>

            <clipPath id="heartClip">
              <path d="M120 202
                C104 185 22 128 15 77
                C8 33 39 8 72 16
                C96 19 112 37 120 53
                C132 29 151 13 177 15
                C211 17 233 45 224 82
                C215 130 144 185 120 202 Z"/>
            </clipPath>
          </defs>

          <path
            fill="url(#heartGradient)"
            stroke="#ff9bb5"
            stroke-width=".8"
            d="M120 202
              C104 185 22 128 15 77
              C8 33 39 8 72 16
              C96 19 112 37 120 53
              C132 29 151 13 177 15
              C211 17 233 45 224 82
              C215 130 144 185 120 202 Z"/>

          <g clip-path="url(#heartClip)">
            <path fill="url(#shadowGradient)"
              d="M120 53
                C99 25 62 26 46 47
                C31 67 43 100 66 123
                C89 145 107 161 120 202
                C133 161 155 143 178 119
                C200 94 212 65 194 44
                C177 25 144 28 120 53 Z"/>

            <ellipse fill="url(#shineGradient)"
              cx="68" cy="48" rx="36" ry="21"
              transform="rotate(-32 68 48)"/>

            <ellipse fill="#fff0f5"
              opacity=".8"
              filter="url(#softGlow)"
              cx="52" cy="39" rx="15" ry="5"
              transform="rotate(-32 52 39)"/>

            <path d="M24 78 C29 47 47 35 72 39"
              fill="none"
              stroke="#ffd5e1"
              stroke-opacity=".55"
              stroke-width="2"
              stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <div class="heart-message" id="heartMessage">
        Touch my heart..<span>Pakhi</span>
      </div>

    </section>

    <div class="photo-frame" id="photoFrame">
      <img id="photo" alt="A special memory">
    </div>

  </main>

  <script>
    (() => {
      /*
       * All seven photos are in the repository root.
       * Keep the filenames exactly as written here.
       */
      const photos = [
        "photo1.jpg",
        "photo2.jpg",
        "photo3.jpg",
        "photo4.jpg",
        "photo5.jpg",
        "photo6.jpg",
        "photo7.jpg"
      ];

      const names = [
        "Pakhi",
        "Shona pakhi",
        "Puttu pakhi",
        "Puchu pakhi",
        "Mitti pakhi",
        "Munu pakhi",
        "Jaan Pakhi"
      ];

      const stage = document.getElementById("stage");
      const heart = document.getElementById("heartArea");
      const message = document.getElementById("heartMessage");
      const photoFrame = document.getElementById("photoFrame");
      const photo = document.getElementById("photo");

      let current = 0;
      let busy = false;
      let audioContext = null;
      let heartbeatTimer = null;
      let heartbeatGain = null;
      let audioReady = false;
      let fadeTimer = null;
      let transitionTimers = [];

      const HEARTBEAT_INTERVAL = 1150;
      const HEART_FADE_SECONDS = 0.8;

      function later(callback, delay) {
        const timer = setTimeout(callback, delay);
        transitionTimers.push(timer);
        return timer;
      }

      function clearTransitionTimers() {
        transitionTimers.forEach(clearTimeout);
        transitionTimers = [];
      }

      // Preload photos to make the reveal smoother.
      photos.forEach((src) => {
        const image = new Image();
        image.src = src;
      });

      /*
       * Each beat has two thumps: lub-dub.
       * The audio interval matches the heart animation.
       */
      function makeHeartbeat() {
        if (!audioContext || !heartbeatGain ||
            audioContext.state !== "running") {
          return;
        }

        const ctx = audioContext;
        const master = heartbeatGain;
        const now = ctx.currentTime;

        [[0, 76, 1], [0.19, 54, 0.72]].forEach(
          ([delay, frequency, strength]) => {
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();

            const time = now + delay;

            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(
              frequency, time
            );
            oscillator.frequency.exponentialRampToValueAtTime(
              32, time + 0.20
            );

            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(
              0.85 * strength, time + 0.025
            );
            gain.gain.exponentialRampToValueAtTime(
              0.0001, time + 0.24
            );

            oscillator.connect(gain);
            gain.connect(master);

            oscillator.start(time);
            oscillator.stop(time + 0.26);
          }
        );
      }

      function startHeartbeat() {
        if (!audioReady || heartbeatTimer) return;

        if (!audioContext ||
            audioContext.state !== "running") {
          return;
        }

        // Restore volume smoothly when the heart returns.
        const now = audioContext.currentTime;

        heartbeatGain.gain.cancelScheduledValues(now);
        heartbeatGain.gain.setValueAtTime(
          Math.max(0.0001, heartbeatGain.gain.value), now
        );
        heartbeatGain.gain.linearRampToValueAtTime(
          0.7, now + 0.35
        );

        makeHeartbeat();

        heartbeatTimer = setInterval(
          makeHeartbeat,
          HEARTBEAT_INTERVAL
        );
      }

      /*
       * Browsers may block audio until a user interacts.
       * The first tap unlocks sound and gives her time
       * to hear the heartbeat before the heart disappears.
       */
      async function prepareHeartbeat() {
        try {
          const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContextClass) return false;

          if (!audioContext) {
            audioContext = new AudioContextClass();
            heartbeatGain = audioContext.createGain();
            heartbeatGain.gain.value = 0.7;
            heartbeatGain.connect(audioContext.destination);
          }

          if (audioContext.state !== "running") {
            await audioContext.resume();
          }

          audioReady = audioContext.state === "running";

          if (audioReady) {
            startHeartbeat();
          }

          return audioReady;
        } catch (error) {
          console.warn("Heartbeat audio unavailable:", error);
          return false;
        }
      }

      /*
       * Stop new beats and fade out any sound already playing.
       */
      function fadeHeartbeat() {
        if (!audioContext || !heartbeatGain) return;

        if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }

        const now = audioContext.currentTime;

        heartbeatGain.gain.cancelScheduledValues(now);
        heartbeatGain.gain.setValueAtTime(
          heartbeatGain.gain.value, now
        );
        heartbeatGain.gain.linearRampToValueAtTime(
          0, now + HEART_FADE_SECONDS
        );

        clearTimeout(fadeTimer);

        fadeTimer = setTimeout(() => {
          if (!heartbeatGain || !audioContext) return;

          heartbeatGain.gain.cancelScheduledValues(
            audioContext.currentTime
          );
          heartbeatGain.gain.setValueAtTime(
            0, audioContext.currentTime
          );
        }, 850);
      }

      function makeSparks() {
        const symbols = ["♥", "♡", "✦", "♥", "♡"];

        for (let i = 0; i < symbols.length; i++) {
          const spark = document.createElement("span");

          spark.className = "spark";
          spark.textContent = symbols[i];
          spark.style.left = (35 + Math.random() * 30) + "%";
          spark.style.top = (40 + Math.random() * 20) + "%";
          spark.style.animationDelay =
            (Math.random() * 0.2) + "s";

          stage.appendChild(spark);

          setTimeout(() => spark.remove(), 1500);
        }
      }

      function returnHeart() {
        current = (current + 1) % photos.length;

        message.replaceChildren();

        const label = document.createTextNode(
          current === 0 ? "Touch my heart.." : "Touch me.."
        );

        const name = document.createElement("span");
        name.textContent = names[current];

        message.append(label, name);
        message.classList.remove("hidden");

        heart.classList.remove("leaving");
        heart.classList.add("beating");
        heart.style.pointerEvents = "auto";

        busy = false;

        // Resume the heartbeat with the returning heart.
        startHeartbeat();
      }

      function fadeOutPhoto() {
        photoFrame.classList.remove("visible");

        later(() => {
          photo.removeAttribute("src");
          photoFrame.style.visibility = "hidden";
          photoFrame.classList.remove("final-memory");

          returnHeart();
        }, 1050);
      }

      async function showMemory() {
        if (busy) return;

        busy = true;
        heart.style.pointerEvents = "none";

        clearTransitionTimers();

        const isFirstTap = !audioReady;
        const isFinalMemory = current === photos.length - 1;

        /*
         * On the first tap, unlock audio and let her hear
         * a few beats. On later taps, the beat is already running.
         */
        if (isFirstTap) {
          await prepareHeartbeat();
        }

        if (isFirstTap && audioReady) {
          await new Promise(resolve => {
            later(resolve, 2300);
          });
        }

        makeSparks();

        // Heart and message disappear together.
        fadeHeartbeat();

        heart.classList.remove("beating");
        heart.classList.add("leaving");
        message.classList.add("hidden");

        // Wait for the heart to fade before revealing the photo.
        later(() => {
          photoFrame.classList.toggle(
            "final-memory", isFinalMemory
          );

          photoFrame.style.visibility = "visible";

          photo.onload = () => {
            photoFrame.classList.add("visible");
          };

          photo.onerror = () => {
            console.error(
              "Could not load " + photos[current] +
              ". Check the filename and extension."
            );

            // Don't leave the experience stuck if a file is missing.
            photoFrame.classList.remove("visible");

            later(() => {
              photoFrame.style.visibility = "hidden";
              returnHeart();
            }, 1000);
          };

          photo.src = photos[current];

          // Cached images may already be loaded.
          if (photo.complete && photo.naturalWidth > 0) {
            photoFrame.classList.add("visible");
          }

          // The final comparison gets a longer viewing time.
          const displayTime = isFinalMemory ? 7500 : 4500;

          later(fadeOutPhoto, displayTime);
        }, 750);
      }

      heart.addEventListener("click", showMemory);

      heart.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          showMemory();
        }
      });

      /*
       * Try autoplay once. If the browser blocks it,
       * the first tap unlocks the heartbeat instead.
       */
      async function attemptAutoplay() {
        try {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) return;

          audioContext = new AudioContextClass();
          heartbeatGain = audioContext.createGain();
          heartbeatGain.gain.value = 0;
          heartbeatGain.connect(audioContext.destination);

          if (audioContext.state === "running") {
            audioReady = true;
            startHeartbeat();
          }
        } catch (error) {
          // First tap will attempt to unlock the audio.
        }
      }

      attemptAutoplay();

    })();
  </script>
</body>
</html>
