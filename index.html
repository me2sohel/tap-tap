<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10070d">
  <title>♥</title>
  <style>
    :root { color-scheme: dark; --pink:#ff477e; --rose:#ff8eae; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    body {
      background: radial-gradient(ellipse at 50% 44%, #351021 0%, #1a0b14 42%, #080609 100%);
      font-family: system-ui, sans-serif;
      display:grid; place-items:center;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }
    .stage {
      position:relative; width:100%; height:100%; min-height:100dvh;
      display:grid; place-items:center; overflow:hidden;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    }
    .ambient {
      position:absolute; inset:-20%;
      background:
        radial-gradient(circle at 18% 22%, #ff477e20 0 2px, transparent 3px),
        radial-gradient(circle at 79% 18%, #ff9fbd26 0 2px, transparent 3px),
        radial-gradient(circle at 68% 77%, #ff477e1c 0 3px, transparent 4px),
        radial-gradient(circle at 24% 82%, #ffb1c91a 0 2px, transparent 3px);
      animation: drift 14s ease-in-out infinite alternate;
      pointer-events:none;
    }
    .photo-frame {
      position:absolute; width:min(78vw, 440px); height:min(70dvh, 620px);
      border-radius:22px; overflow:hidden; opacity:0;
      transform: scale(.96) translateY(12px);
      box-shadow: 0 20px 80px #0009, 0 0 0 1px #ffffff17;
      transition: opacity .38s ease, transform .55s cubic-bezier(.2,.8,.2,1);
      background:#1a0d15;
    }
    .photo-frame.visible { opacity:1; transform:scale(1) translateY(0); }
    .photo-frame img { width:100%; height:100%; object-fit:contain; display:block; background:#120a10; }
    .photo-frame.empty {
      opacity:1; transform:none; width:min(70vw, 330px); height:min(70vw, 330px);
      background:transparent; box-shadow:none; overflow:visible;
    }
    .heart-button {
      position:absolute; z-index:5; left:50%; top:50%; transform:translate(-50%,-50%);
      width:clamp(100px, 24vw, 148px); aspect-ratio:1; border:0; padding:0;
      background:transparent; cursor:pointer; touch-action:manipulation;
      filter: drop-shadow(0 0 14px #ff286d80) drop-shadow(0 0 36px #ff286d42);
      transition:filter .2s ease;
    }
    .heart-button:focus-visible { outline:2px solid #ffd4e0; outline-offset:10px; border-radius:50%; }
    .heart-shape { width:100%; height:100%; display:block; overflow:visible; }
    .heart-shape path {
      fill:url(#heartFill); stroke:#ffb2c9; stroke-width:1.5;
      transform-origin:50% 50%; animation: heartbeat 1.25s ease-in-out infinite;
    }
    .heart-button.beat path { animation: tapbeat .38s ease-out 1; }
    .controls {
      position:absolute; z-index:8; right:max(18px, env(safe-area-inset-right));
      top:max(18px, env(safe-area-inset-top)); display:flex; gap:10px;
    }
    .icon-button {
      width:42px; height:42px; border:1px solid #ffffff24; border-radius:50%;
      display:grid; place-items:center; background:#170b13a8; color:#ffd3df;
      backdrop-filter:blur(10px); cursor:pointer;
    }
    .icon-button svg { width:19px; height:19px; }
    .upload { position:absolute; z-index:8; left:16px; top:16px; width:42px; height:42px; }
    .upload input { display:none; }
    .upload label { width:100%; height:100%; display:grid; place-items:center; border:1px solid #ffffff24; border-radius:50%; background:#170b13a8; color:#ffd3df; cursor:pointer; backdrop-filter:blur(10px); }
    .upload svg { width:19px; height:19px; }
    .counter {
      position:absolute; z-index:6; bottom:max(22px, env(safe-area-inset-bottom));
      left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%;
      background:#ff8eae; opacity:.6;
    }
    .heart-float {
      position:absolute; z-index:4; pointer-events:none; color:#ff6d98; font-size:18px;
      animation: floatUp .9s ease-out forwards; text-shadow:0 0 14px #ff477e;
    }
    @keyframes heartbeat {
      0%, 100% { transform:scale(1); }
      12% { transform:scale(1.08); }
      24% { transform:scale(.99); }
      36% { transform:scale(1.13); }
      52% { transform:scale(1); }
    }
    @keyframes tapbeat {
      0% { transform:scale(1); } 30% { transform:scale(1.24); } 65% { transform:scale(.91); } 100% { transform:scale(1); }
    }
    @keyframes floatUp { from { opacity:0; transform:translateY(0) scale(.6) rotate(0); } 20% {opacity:1;} to {opacity:0; transform:translateY(-90px) scale(1.35) rotate(20deg);} }
    @keyframes drift { from { transform:translate3d(-1%,0,0) scale(1); } to { transform:translate3d(1%,-1%,0) scale(1.04); } }
    @media (max-width: 520px) {
      .photo-frame { width:82vw; height:min(68dvh, 580px); border-radius:18px; }
      .heart-button { width:clamp(94px, 26vw, 126px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Tap the heart to change photos">
    <div class="ambient"></div>
    <div class="photo-frame empty" id="photoFrame">
      <img id="photo" alt="" hidden>
      <svg id="emptyHeart" class="heart-shape" viewBox="0 0 100 90" aria-hidden="true">
        <defs><linearGradient id="heartFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff789e"/><stop offset=".55" stop-color="#f52f68"/><stop offset="1" stop-color="#a80e43"/></linearGradient></defs>
        <path d="M50 83 C42 75 8 52 8 29 C8 5 36 1 50 22 C64 1 92 5 92 29 C92 52 58 75 50 83 Z"/>
      </svg>
    </div>
    <div class="upload">
      <label for="photoUpload" aria-label="Choose photos" title="Choose photos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      </label>
      <input id="photoUpload" type="file" accept="image/*" multiple>
    </div>
    <div class="controls">
      <button class="icon-button" id="soundToggle" aria-label="Mute heartbeat" title="Mute / unmute heartbeat">
        <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </div>
    <button class="heart-button" id="heartButton" aria-label="Next photo">
      <svg class="heart-shape" viewBox="0 0 100 90" aria-hidden="true">
        <defs><linearGradient id="buttonFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff789e"/><stop offset=".55" stop-color="#f52f68"/><stop offset="1" stop-color="#a80e43"/></linearGradient></defs>
        <path d="M50 83 C42 75 8 52 8 29 C8 5 36 1 50 22 C64 1 92 5 92 29 C92 52 58 75 50 83 Z" fill="url(#buttonFill)" stroke="#ffb2c9" stroke-width="1.5"/>
      </svg>
    </button>
    <div class="counter" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      const input = document.getElementById('photoUpload');
      const photo = document.getElementById('photo');
      const frame = document.getElementById('photoFrame');
      const emptyHeart = document.getElementById('emptyHeart');
      const heartButton = document.getElementById('heartButton');
      const soundToggle = document.getElementById('soundToggle');
      const soundIcon = document.getElementById('soundIcon');
      const stage = document.getElementById('stage');
      let images = [], index = -1, muted = false, audioCtx = null;

      function updateSoundIcon() {
        soundIcon.innerHTML = muted
          ? '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/>'
          : '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
        soundToggle.setAttribute('aria-label', muted ? 'Enable heartbeat' : 'Mute heartbeat');
      }
      function heartbeatSound() {
        if (muted) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          // Two soft, low-frequency thumps create a heartbeat without an external audio file.
          [[0, 92, .17], [.19, 68, .12]].forEach(([delay, freq, volume]) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + delay);
            osc.frequency.exponentialRampToValueAtTime(42, now + delay + .13);
            gain.gain.setValueAtTime(.0001, now + delay);
            gain.gain.exponentialRampToValueAtTime(volume, now + delay + .018);
            gain.gain.exponentialRampToValueAtTime(.0001, now + delay + .17);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + delay); osc.stop(now + delay + .18);
          });
        } catch (e) { /* Audio may be unavailable; photo interaction still works. */ }
      }
      function burst() {
        const r = heartButton.getBoundingClientRect();
        for (let i = 0; i < 4; i++) {
          const el = document.createElement('span');
          el.className = 'heart-float';
          el.textContent = ['♥', '♡', '♥', '✦'][i];
          el.style.left = (r.left + r.width * (.25 + Math.random() * .5)) + 'px';
          el.style.top = (r.top + r.height * (.25 + Math.random() * .5)) + 'px';
          el.style.animationDelay = (Math.random() * .12) + 's';
          stage.appendChild(el);
          setTimeout(() => el.remove(), 1100);
        }
      }
      function showPhoto(nextIndex) {
        if (!images.length) return;
        index = (nextIndex + images.length) % images.length;
        const chosen = images[index];
        photo.style.opacity = '0';
        setTimeout(() => {
          photo.src = chosen.url;
          photo.hidden = false;
          emptyHeart.hidden = true;
          frame.classList.remove('empty');
          photo.onload = () => { photo.style.opacity = '1'; };
          frame.classList.add('visible');
        }, 110);
      }
      input.addEventListener('change', () => {
        const files = Array.from(input.files || []).filter(f => f.type.startsWith('image/'));
        if (!files.length) return;
        images.forEach(item => URL.revokeObjectURL(item.url));
        images = files.map(file => ({ name: file.name, url: URL.createObjectURL(file) }));
        index = -1;
        showPhoto(0);
      });
      heartButton.addEventListener('click', () => {
        heartbeatSound();
        heartButton.classList.remove('beat');
        void heartButton.offsetWidth;
        heartButton.classList.add('beat');
        burst();
        if (images.length) showPhoto(index + 1);
      });
      soundToggle.addEventListener('click', () => {
        muted = !muted;
        updateSoundIcon();
        if (!muted) heartbeatSound();
      });
      updateSoundIcon();
    })();
  </script>
</body>
</html>
