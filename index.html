
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10040d">
  <title>My Heart Beats for You ❤️</title>

  <style>
    :root {
      --bg: #10040d;
      --pink: #ff91b6;
      --soft-pink: #ffd9e5;
      --red: #ff174d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #421026 0%, #210817 36%, #10040d 76%);
      color: white;
      font-family: Georgia, "Times New Roman", serif;
    }

    button {
      font: inherit;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 18px 105px;
    }

    /* Subtle background atmosphere */

    .ambient-glow {
      position: absolute;
      z-index: -2;
      width: min(90vw, 430px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ff174d;
      opacity: 0.075;
      filter: blur(85px);
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      z-index: -1;
      color: #ff9fbd;
      opacity: 0.45;
      pointer-events: none;
      animation: sparkle 3s ease-in-out infinite alternate;
    }

    .sparkle:nth-of-type(2) {
      top: 16%;
      left: 15%;
      animation-delay: .8s;
    }

    .sparkle:nth-of-type(3) {
      top: 25%;
      right: 14%;
      animation-delay: 1.5s;
    }

    .sparkle:nth-of-type(4) {
      bottom: 24%;
      left: 19%;
      animation-delay: .4s;
    }

    .sparkle:nth-of-type(5) {
      right: 17%;
      bottom: 30%;
      animation-delay: 1.2s;
    }

    @keyframes sparkle {
      from {
        opacity: .12;
        transform: scale(.75);
      }
      to {
        opacity: .65;
        transform: scale(1.2);
      }
    }

    /* Heart experience */

    .experience {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity .65s ease, transform .65s ease;
    }

    .heart-area {
      width: min(66vw, 290px);
      max-width: 290px;
      min-width: 190px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      transition: opacity .55s ease, transform .65s ease;
      filter: drop-shadow(0 0 22px #ff174d35);
    }

    .heart-area:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 8px;
      border-radius: 40%;
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      transform-origin: 50% 55%;
      animation: heartBeat 1.15s infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      8% { transform: scale(1.09); }
      16% { transform: scale(1); }
      25% { transform: scale(1.14); }
      37% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .heart-message {
      margin-top: 18px;
      color: #ffcfdf;
      font-size: clamp(17px, 4.7vw, 23px);
      text-align: center;
      letter-spacing: .5px;
      line-height: 1.5;
      text-shadow: 0 0 18px #ff387a45;
      transition: opacity .4s ease;
    }

    .heart-message span {
      display: block;
      margin-top: 5px;
      color: #ff8eb3;
      font-size: clamp(25px, 6.4vw, 34px);
      font-style: italic;
    }

    .hint {
      margin-top: 13px;
      color: #d9a2b7;
      opacity: .72;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }

    /* Photos */

    .photo-frame {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #10040df7;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 1s ease,
        visibility 1s ease;
    }

    .photo-frame.visible {
      opacity: 1;
      visibility: visible;
    }

    .photo-frame img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 5px;
      opacity: 0;
      transform: scale(.91);
      filter: drop-shadow(0 0 28px #ff174d18);
      transition:
        opacity 1.15s ease,
        transform 1.8s cubic-bezier(.2, .7, .2, 1);
    }

    .photo-frame.visible img {
      opacity: 1;
      transform: scale(1);
    }

    .photo-frame.final-memory {
      padding: 12px;
      background:
        radial-gradient(ellipse at center, #250918 0%, #10040d 78%);
    }

    .photo-frame.final-memory img {
      max-width: 100%;
      max-height: 96%;
    }

    /* Silence button */

    .silence-button {
      position: absolute;
      z-index: 5;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 13px 21px;
      border: 1px solid #ff8eae75;
      border-radius: 40px;
      background: linear-gradient(135deg, #491328e8, #200b17ed);
      color: #ffd6e2;
      font-size: clamp(12px, 3.4vw, 15px);
      letter-spacing: .3px;
      text-align: center;
      box-shadow: 0 0 22px #ff356e18;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        background .4s ease,
        border-color .4s ease,
        opacity .4s ease,
        transform .3s ease;
    }

    .silence-button:active {
      transform: translateX(-50%) scale(.96);
    }

    .silence-button:focus-visible {
      outline: 2px solid #ffb4c9;
      outline-offset: 4px;
    }

    .silence-button:disabled {
      cursor: default;
      opacity: .75;
    }

    .silence-button.silenced {
      border-color: #ff8eae35;
      background: #170b13e8;
      color: #ffb7cc;
    }

    /* Forever message */

    .forever-message {
      position: absolute;
      z-index: 6;
      bottom: 95px;
      left: 50%;
      width: min(88%, 440px);
      transform: translate(-50%, 14px);
      color: #ffd9e5;
      font-size: clamp(16px, 4.2vw, 22px);
      line-height: 1.65;
      font-style: italic;
      text-align: center;
      text-shadow: 0 0 20px #ff477e50;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 1.2s ease,
        transform 1.2s ease,
        visibility 1.2s;
      pointer-events: none;
    }

    .forever-message.visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    /* Heart disappears during a photo reveal */

    .experience.hidden {
      opacity: 0;
      transform: scale(.92);
      pointer-events: none;
    }

    .experience.hidden .heart-area {
      transform: scale(.7);
    }

    @media (max-height: 600px) {
      .stage {
        padding-top: 12px;
        padding-bottom: 82px;
      }

      .heart-area {
        width: min(48vh, 220px);
        min-width: 150px;
      }

      .heart-message {
        margin-top: 5px;
      }

      .hint {
        margin-top: 5px;
      }

      .silence-button {
        bottom: 13px;
        padding: 10px 16px;
      }

      .forever-message {
        bottom: 68px;
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sparkle {
        animation: none;
      }

      .heart-svg {
        animation-duration: 2.3s;
      }
    }
  </style>
</head>

<body>
  <main class="stage" id="stage">
    <div class="ambient-glow"></div>

    <div class="sparkle" aria-hidden="true">✦</div>
    <div class="sparkle" aria-hidden="true">✧</div>
    <div class="sparkle" aria-hidden="true">✦</div>
    <div class="sparkle" aria-hidden="true">✧</div>

    <section class="experience" id="experience">
      <div
        class="heart-area"
        id="heartArea"
        role="button"
        tabindex="0"
        aria-label="Touch my heart to reveal a memory"
      >
        <svg
          class="heart-svg"
          viewBox="0 0 200 190"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="heartGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff829f"/>
              <stop offset="24%" stop-color="#ff365e"/>
              <stop offset="62%" stop-color="#ed003b"/>
              <stop offset="100%" stop-color="#8d0028"/>
            </linearGradient>

            <linearGradient id="heartShine" x1="0" y1="0" x2=".8" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity=".72"/>
              <stop offset="35%" stop-color="#ffffff" stop-opacity=".12"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>

            <radialGradient id="heartLight" cx="30%" cy="18%" r="75%">
              <stop offset="0%" stop-color="#ffbdcf" stop-opacity=".55"/>
              <stop offset="100%" stop-color="#ffbdcf" stop-opacity="0"/>
            </radialGradient>

            <filter id="heartShadow" x="-30%" y="-30%" width="160%" height="170%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
              <feOffset dy="6"/>
              <feComponentTransfer>
                <feFuncA type="linear" slope=".32"/>
              </feComponentTransfer>
              <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

            <clipPath id="heartClip">
              <path d="M100 174
                C88 163 20 112 12 70
                C4 31 31 10 59 15
                C79 17 92 30 100 43
                C110 26 126 14 146 15
                C176 15 195 40 188 70
                C180 112 113 163 100 174Z"/>
            </clipPath>
          </defs>

          <g filter="url(#heartShadow)">
            <path
              d="M100 174
                C88 163 20 112 12 70
                C4 31 31 10 59 15
                C79 17 92 30 100 43
                C110 26 126 14 146 15
                C176 15 195 40 188 70
                C180 112 113 163 100 174Z"
              fill="url(#heartGradient)"
            />

            <g clip-path="url(#heartClip)">
              <ellipse
                cx="64"
                cy="45"
                rx="76"
                ry="62"
                fill="url(#heartLight)"
              />

              <path
                d="M22 56
                  C24 31 43 22 60 26
                  C75 29 83 37 88 45
                  C71 39 57 40 47 50
                  C38 59 34 70 35 82
                  C26 74 22 66 22 56Z"
                fill="url(#heartShine)"
              />

              <path
                d="M18 70
                  C20 48 30 35 45 32"
                fill="none"
                stroke="#fff"
                stroke-opacity=".25"
                stroke-width="3"
                stroke-linecap="round"
              />
            </g>
          </g>
        </svg>
      </div>

      <div class="heart-message" id="heartMessage">
        Touch my heart..
        <span id="petName">Pakhi</span>
      </div>

      <div class="hint">One touch · One memory · Infinite love</div>
    </section>

    <div class="photo-frame" id="photoFrame" aria-hidden="true">
      <img id="memoryPhoto" src="photo1.jpg" alt="A special memory">
    </div>

    <button class="silence-button" id="silenceButton" type="button">
      ♡ Tap to silence my heartbeat ♡
    </button>

    <div class="forever-message" id="foreverMessage" aria-live="polite">
      My heartbeat may fall silent, but my love for you
      will beat on forever — beyond time, beyond the
      universe, for all infinity. ♾️❤️
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      // Keep these photos in the same GitHub repository folder
      // as index.html.
      const memories = [
        { photo: "photo1.jpg", name: "Pakhi", final: false },
        { photo: "photo2.jpg", name: "Shona pakhi", final: false },
        { photo: "photo3.jpg", name: "Puttu pakhi", final: false },
        { photo: "photo4.jpg", name: "Puchu pakhi", final: false },
        { photo: "photo5.jpg", name: "Mitti pakhi", final: false },
        { photo: "photo6.jpg", name: "Munu pakhi", final: false },
        { photo: "photo7.jpg", name: "Jaan Pakhi", final: true }
      ];

      const heartArea = document.getElementById("heartArea");
      const experience = document.getElementById("experience");
      const petName = document.getElementById("petName");
      const photoFrame = document.getElementById("photoFrame");
      const memoryPhoto = document.getElementById("memoryPhoto");
      const silenceButton = document.getElementById("silenceButton");
      const foreverMessage = document.getElementById("foreverMessage");

      let current = 0;
      let busy = false;
      let soundMuted = false;

      let audioContext = null;
      let masterGain = null;
      let heartbeatTimer = null;
      let audioReady = false;
      let fadeTimer = null;
      let audioGeneration = 0;
      let sequenceGeneration = 0;

      const HEARTBEAT_INTERVAL = 1150;
      const PHOTO_DURATION = 4500;
      const FINAL_PHOTO_DURATION = 7500;

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      // Create the sound using the browser's Web Audio API.
      function createAudio() {
        if (audioContext) return true;

        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return false;

        try {
          audioContext = new AudioContextClass();
          masterGain = audioContext.createGain();
          masterGain.gain.value = 0;
          masterGain.connect(audioContext.destination);
          return true;
        } catch (error) {
          console.warn("Heartbeat audio is unavailable:", error);
          audioContext = null;
          masterGain = null;
          return false;
        }
      }

      function beat(frequency, startTime, duration, volume) {
        if (!audioContext || !masterGain) return;

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, startTime);
        oscillator.frequency.exponentialRampToValueAtTime(
          Math.max(25, frequency * 0.55),
          startTime + duration
        );

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(
          Math.max(0.0002, volume),
          startTime + 0.018
        );
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          startTime + duration
        );

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.03);

        oscillator.addEventListener("ended", () => {
          oscillator.disconnect();
          gain.disconnect();
        }, { once: true });
      }

      function makeHeartbeat() {
        if (
          !audioContext ||
          audioContext.state !== "running" ||
          soundMuted
        ) {
          return;
        }

        const now = audioContext.currentTime + 0.015;

        // Lub — dub: two soft low-frequency pulses.
        beat(78, now, 0.22, 0.72);
        beat(62, now + 0.19, 0.27, 0.52);
      }

      function clearHeartbeatTimer() {
        if (heartbeatTimer !== null) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }
      }

      function startHeartbeat() {
        if (
          !audioReady ||
          !audioContext ||
          !masterGain ||
          heartbeatTimer !== null ||
          soundMuted
        ) {
          return;
        }

        if (fadeTimer !== null) {
          clearInterval(fadeTimer);
          fadeTimer = null;
        }

        const generation = ++audioGeneration;

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }

        const now = audioContext.currentTime;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(
          masterGain.gain.value,
          now
        );
        masterGain.gain.linearRampToValueAtTime(0.72, now + 0.45);

        makeHeartbeat();
        heartbeatTimer = setInterval(
          makeHeartbeat,
          HEARTBEAT_INTERVAL
        );

        // The generation check protects against an old fade
        // interfering with a newly started heartbeat.
        return generation;
      }

      function fadeHeartbeat() {
        clearHeartbeatTimer();

        if (fadeTimer !== null) {
          clearInterval(fadeTimer);
          fadeTimer = null;
        }

        ++audioGeneration;

        if (!audioContext || !masterGain) return;

        const now = audioContext.currentTime;
        const currentVolume = masterGain.gain.value;

        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(currentVolume, now);
        masterGain.gain.linearRampToValueAtTime(0, now + 0.65);

        // Ensure the audio gain is fully zero after the fade.
        fadeTimer = setInterval(() => {
          if (!audioContext || !masterGain) {
            clearInterval(fadeTimer);
            fadeTimer = null;
            return;
          }

          if (audioContext.state === "closed") {
            clearInterval(fadeTimer);
            fadeTimer = null;
            return;
          }

          if (masterGain.gain.value < 0.005) {
            const t = audioContext.currentTime;
            masterGain.gain.cancelScheduledValues(t);
            masterGain.gain.setValueAtTime(0, t);
            clearInterval(fadeTimer);
            fadeTimer = null;
          }
        }, 80);
      }

      async function prepareHeartbeat() {
        if (soundMuted) return false;
        if (!createAudio()) return false;

        try {
          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }

          audioReady = audioContext.state === "running";

          if (audioReady) {
            startHeartbeat();
          }

          return audioReady;
        } catch (error) {
          console.warn("Could not start heartbeat audio:", error);
          return false;
        }
      }

      function preloadPhotos() {
        memories.forEach(memory => {
          const img = new Image();
          img.src = memory.photo;
        });
      }

      function showPhoto(memory) {
        memoryPhoto.onerror = () => {
          console.error("Could not load image:", memory.photo);
          memoryPhoto.alt = "Photo not found: " + memory.photo;
        };

        memoryPhoto.onload = () => {
          memoryPhoto.alt = memory.final
            ? "My love compared with the observable universe"
            : "A special memory";
        };

        memoryPhoto.src = memory.photo;
        photoFrame.classList.toggle("final-memory", memory.final);
        photoFrame.classList.add("visible");
        photoFrame.setAttribute("aria-hidden", "false");
      }

      async function showMemory() {
        if (busy) return;

        busy = true;
        const sequence = ++sequenceGeneration;
        const memory = memories[current];

        // A tap is required by most mobile browsers to unlock audio.
        await prepareHeartbeat();

        if (sequence !== sequenceGeneration) return;

        // Give the lub-dub a moment to be heard before it fades.
        await wait(300);

        if (sequence !== sequenceGeneration) return;

        experience.classList.add("hidden");
        fadeHeartbeat();

        await wait(450);

        if (sequence !== sequenceGeneration) return;

        showPhoto(memory);

        const duration = memory.final
          ? FINAL_PHOTO_DURATION
          : PHOTO_DURATION;

        await wait(duration);

        if (sequence !== sequenceGeneration) return;

        photoFrame.classList.remove("visible");
        photoFrame.setAttribute("aria-hidden", "true");

        // Allow the photo to fade out before restoring the heart.
        await wait(1050);

        if (sequence !== sequenceGeneration) return;

        experience.classList.remove("hidden");

        // Advance to the next photo and pet name.
        current = (current + 1) % memories.length;
        petName.textContent = memories[current].name;

        if (!soundMuted) {
          startHeartbeat();
        }

        await wait(500);

        if (sequence === sequenceGeneration) {
          busy = false;
        }
      }

      function handleHeartActivation(event) {
        if (
          event &&
          event.type === "keydown" &&
          event.key !== "Enter" &&
          event.key !== " "
        ) {
          return;
        }

        if (event && event.type === "keydown") {
          event.preventDefault();
        }

        showMemory();
      }

      heartArea.addEventListener("click", handleHeartActivation);
      heartArea.addEventListener("keydown", handleHeartActivation);

      silenceButton.addEventListener("click", () => {
        if (soundMuted) return;

        soundMuted = true;
        fadeHeartbeat();

        silenceButton.textContent = "♡ My heartbeat is now silent ♡";
        silenceButton.classList.add("silenced");
        silenceButton.disabled = true;

        foreverMessage.classList.add("visible");
      });

      // Try autoplay, but browsers may require a user gesture.
      // The first heart tap also attempts to enable audio.
      function attemptAutoplay() {
        if (!createAudio()) return;

        audioContext.resume()
          .then(() => {
            if (audioContext.state === "running" && !soundMuted) {
              audioReady = true;
              startHeartbeat();
            }
          })
          .catch(() => {
            // Normal on mobile browsers before the first interaction.
          });
      }

      preloadPhotos();
      attemptAutoplay();
    })();
  </script>
</body>
</html>
