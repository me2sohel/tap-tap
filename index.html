
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10050c">
  <title>♥</title>

  <style>
    :root {
      --pink: #ff356e;
      --rose: #ff9bb8;
      --dark: #10050c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 45%,
          #421326 0%, #200b17 40%, #080509 100%);
      color: #ffe3ec;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      isolation: isolate;
    }

    /* Soft romantic background */

    .glow {
      position: absolute;
      width: 85vw;
      height: 85vw;
      max-width: 600px;
      max-height: 600px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        #ff286b20 0%,
        #ff286b08 40%,
        transparent 70%
      );
      animation: glow 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      color: #ff8aaa;
      opacity: 0;
      pointer-events: none;
      animation: float 7s linear infinite;
    }

    .particle:nth-child(2) {
      left: 12%;
      bottom: -20px;
      animation-delay: 0s;
    }

    .particle:nth-child(3) {
      left: 80%;
      bottom: -20px;
      animation-delay: 2s;
    }

    .particle:nth-child(4) {
      left: 55%;
      bottom: -20px;
      animation-delay: 4s;
    }

    /* Main interactive area */

    .experience {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .heart-area {
      position: relative;
      width: min(66vw, 310px);
      aspect-ratio: 1.08;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity .65s ease, transform .65s ease;
      filter: drop-shadow(0 0 20px #ff174b35);
    }

    .heart-area.beating {
      animation: heartBeat 1.15s ease-in-out infinite;
    }

    .heart-area.leaving {
      opacity: 0;
      transform: scale(.58);
      pointer-events: none;
      animation: none;
    }

    .heart-area svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Realistic-looking glossy heart */

    .heart-base {
      fill: url(#heartGradient);
      stroke: #ff9bb5;
      stroke-width: .8;
    }

    .heart-shadow {
      fill: url(#shadowGradient);
      pointer-events: none;
    }

    .heart-highlight {
      fill: url(#shineGradient);
      opacity: .82;
      pointer-events: none;
    }

    .heart-glint {
      fill: #fff0f5;
      opacity: .8;
      filter: url(#softGlow);
      pointer-events: none;
    }

    .heart-message {
      margin-top: 24px;
      min-height: 42px;
      text-align: center;
      color: #ffd6e2;
      font-size: clamp(21px, 5vw, 29px);
      letter-spacing: .5px;
      text-shadow: 0 0 18px #ff477e80;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .45s ease, transform .45s ease;
      pointer-events: none;
    }

    .heart-message.hidden {
      opacity: 0;
      transform: translateY(8px);
    }

    .heart-message span {
      color: #ff8eae;
      font-style: italic;
    }

    /* Photos */

    .photo-frame {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transform: scale(.94);
      transition:
        opacity .75s ease,
        transform .85s cubic-bezier(.2,.8,.2,1),
        visibility .75s;
      pointer-events: none;
    }

    .photo-frame.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .photo-frame img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(86vw, 480px);
      max-height: 76dvh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow:
        0 18px 70px #000a,
        0 0 28px #ff356e30,
        0 0 0 1px #ffc1d51c;
    }

    /* Small romantic light effects */

    .spark {
      position: absolute;
      z-index: 4;
      pointer-events: none;
      color: #ff7da2;
      font-size: 20px;
      animation: sparkUp 1.2s ease-out forwards;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.07); }
      23% { transform: scale(.99); }
      35% { transform: scale(1.13); }
      48% { transform: scale(1); }
    }

    @keyframes glow {
      from { transform: scale(.88); opacity: .6; }
      to { transform: scale(1.12); opacity: 1; }
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(.6) rotate(0);
        opacity: 0;
      }
      15% { opacity: .55; }
      85% { opacity: .35; }
      100% {
        transform: translateY(-110vh) scale(1.3) rotate(35deg);
        opacity: 0;
      }
    }

    @keyframes sparkUp {
      from {
        opacity: 0;
        transform: translateY(0) scale(.6);
      }
      20% { opacity: 1; }
      to {
        opacity: 0;
        transform: translateY(-100px) scale(1.4) rotate(25deg);
      }
    }

    @media (max-width: 520px) {
      .heart-area {
        width: min(72vw, 285px);
      }

      .photo-frame {
        padding: 18px;
      }

      .photo-frame img {
        max-width: 88vw;
        max-height: 75dvh;
        border-radius: 13px;
      }

      .heart-message {
        margin-top: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow,
      .particle,
      .heart-area.beating {
        animation-duration: 2s;
      }
    }
  </style>
</head>

<body>
  <main class="stage" id="stage">

    <div class="glow"></div>

    <span class="particle">♡</span>
    <span class="particle">♥</span>
    <span class="particle">✦</span>

    <section class="experience">

      <div class="heart-area beating" id="heartArea"
           role="button" tabindex="0"
           aria-label="Touch my heart">

        <svg viewBox="0 0 240 220"
             xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true">

          <defs>
            <linearGradient id="heartGradient"
              x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff9aaf"/>
              <stop offset="22%" stop-color="#ff527d"/>
              <stop offset="53%" stop-color="#e90d48"/>
              <stop offset="78%" stop-color="#b80539"/>
              <stop offset="100%" stop-color="#65051f"/>
            </linearGradient>

            <linearGradient id="shadowGradient"
              x1="0" y1="0" x2=".8" y2="1">
              <stop offset="0%" stop-color="#ffb0c5"
                    stop-opacity=".05"/>
              <stop offset="55%" stop-color="#79001e"
                    stop-opacity=".12"/>
              <stop offset="100%" stop-color="#27000b"
                    stop-opacity=".75"/>
            </linearGradient>

            <linearGradient id="shineGradient"
              x1="0" y1="0" x2="1" y2=".8">
              <stop offset="0%" stop-color="#fff0f5"
                    stop-opacity=".85"/>
              <stop offset="30%" stop-color="#ffb6cb"
                    stop-opacity=".4"/>
              <stop offset="100%" stop-color="#ffb6cb"
                    stop-opacity="0"/>
            </linearGradient>

            <filter id="softGlow" x="-100%" y="-100%"
                    width="300%" height="300%">
              <feGaussianBlur stdDeviation="2"/>
            </filter>

            <clipPath id="heartClip">
              <path d="M120 202
                C104 185 22 128 15 77
                C8 33 39 8 72 16
                C96 19 112 37 120 53
                C132 29 151 13 177 15
                C211 17 233 45 224 82
                C215 130 144 185 120 202 Z"/>
            </clipPath>
          </defs>

          <path class="heart-base"
            d="M120 202
              C104 185 22 128 15 77
              C8 33 39 8 72 16
              C96 19 112 37 120 53
              C132 29 151 13 177 15
              C211 17 233 45 224 82
              C215 130 144 185 120 202 Z"/>

          <g clip-path="url(#heartClip)">
            <path class="heart-shadow"
              d="M120 53
                C99 25 62 26 46 47
                C31 67 43 100 66 123
                C89 145 107 161 120 202
                C133 161 155 143 178 119
                C200 94 212 65 194 44
                C177 25 144 28 120 53 Z"/>

            <ellipse class="heart-highlight"
              cx="68" cy="48" rx="36" ry="21"
              transform="rotate(-32 68 48)"/>

            <ellipse class="heart-glint"
              cx="52" cy="39" rx="15" ry="5"
              transform="rotate(-32 52 39)"/>

            <path d="M24 78
              C29 47 47 35 72 39"
              fill="none" stroke="#ffd5e1"
              stroke-opacity=".55" stroke-width="2"
              stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <div class="heart-message" id="heartMessage">
        Touch my heart..<span>Pakhi</span>
      </div>

    </section>

    <div class="photo-frame" id="photoFrame">
      <img id="photo" src="" alt="A special memory">
    </div>

  </main>

  <script>
    (() => {
      /*
       * Put your 7 photos inside a folder named "images".
       * Keep these filenames or change the paths below.
       */
      const photos = [
        "images/photo1.jpg",
        "images/photo2.jpg",
        "images/photo3.jpg",
        "images/photo4.jpg",
        "images/photo5.jpg",
        "images/photo6.jpg",
        "images/photo7.jpg"
      ];

      const names = [
        "Pakhi",
        "Shona pakhi",
        "Puttu pakhi",
        "Puchu pakhi",
        "Mitti pakhi",
        "Munu pakhi",
        "Jaan Pakhi"
      ];

      const stage = document.getElementById("stage");
      const heart = document.getElementById("heartArea");
      const message = document.getElementById("heartMessage");
      const photoFrame = document.getElementById("photoFrame");
      const photo = document.getElementById("photo");

      let current = 0;
      let busy = false;
      let audioContext = null;

      // Preload all seven photos.
      photos.forEach((src) => {
        const image = new Image();
        image.src = src;
      });

      function playHeartbeat() {
        try {
          audioContext = audioContext ||
            new (window.AudioContext ||
                 window.webkitAudioContext)();

          if (audioContext.state === "suspended") {
            audioContext.resume();
          }

          const now = audioContext.currentTime;

          // Two soft thumps: lub-dub.
          [[0, 78, 0.24], [0.18, 57, 0.18]].forEach(
            ([delay, frequency, volume]) => {
              const oscillator = audioContext.createOscillator();
              const gain = audioContext.createGain();

              oscillator.type = "sine";
              oscillator.frequency.setValueAtTime(
                frequency, now + delay
              );
              oscillator.frequency.exponentialRampToValueAtTime(
                35, now + delay + 0.16
              );

              gain.gain.setValueAtTime(
                0.0001, now + delay
              );
              gain.gain.exponentialRampToValueAtTime(
                volume, now + delay + 0.025
              );
              gain.gain.exponentialRampToValueAtTime(
                0.0001, now + delay + 0.22
              );

              oscillator.connect(gain);
              gain.connect(audioContext.destination);

              oscillator.start(now + delay);
              oscillator.stop(now + delay + 0.23);
            }
          );
        } catch (error) {
          // The animation continues if audio is unavailable.
        }
      }

      function makeSparks() {
        const symbols = ["♥", "♡", "✦", "♥", "♡"];

        for (let i = 0; i < 5; i++) {
          const spark = document.createElement("span");
          spark.className = "spark";
          spark.textContent = symbols[i];

          spark.style.left =
            (35 + Math.random() * 30) + "%";
          spark.style.top =
            (40 + Math.random() * 20) + "%";
          spark.style.animationDelay =
            (Math.random() * 0.2) + "s";

          stage.appendChild(spark);

          setTimeout(() => spark.remove(), 1500);
        }
      }

      function fadeOutPhoto() {
        photoFrame.classList.remove("visible");

        setTimeout(() => {
          photo.removeAttribute("src");
          photoFrame.style.visibility = "hidden";

          // Return the heart with the next pet name.
          current = (current + 1) % photos.length;
          message.innerHTML =
            'Touch me..<span>' + names[current] + '</span>';

          message.classList.remove("hidden");
          heart.classList.remove("leaving");
          heart.classList.add("beating");
          heart.style.pointerEvents = "auto";

          busy = false;
        }, 800);
      }

      function showMemory() {
        if (busy) return;
        busy = true;

        playHeartbeat();
        makeSparks();

        // Heart and message disappear together.
        heart.classList.remove("beating");
        heart.classList.add("leaving");
        message.classList.add("hidden");

        // Start showing the selected photo.
        setTimeout(() => {
          photoFrame.style.visibility = "visible";
          photo.src = photos[current];
          photoFrame.classList.add("visible");

          // Keep the memory visible for a few seconds.
          setTimeout(() => {
            fadeOutPhoto();
          }, 3000);

        }, 300);
      }

      heart.addEventListener("click", showMemory);

      heart.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          showMemory();
        }
      });

    })();
  </script>
</body>
</html>
